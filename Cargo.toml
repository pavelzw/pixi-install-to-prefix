[package]
name = "pixi-install-to-prefix"
description = "Install pixi environments to an arbitrary prefix"
version = "0.1.8"
edition = "2024"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

[features]
default = ["native-tls"]
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_networking/native-tls",
  "rattler_package_streaming/native-tls",
]
rustls = [
  "reqwest/rustls",
  "rattler/rustls",
  "rattler_networking/rustls",
  "rattler_package_streaming/rustls",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "string"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
rattler = { version = "0.51.0", default-features = false, features = [
  "indicatif",
] }
rattler_conda_types = "0.55.0"
rattler_config = { version = "0.8.0" }
rattler_lock = "0.34.0"
rattler_networking = { version = "0.31.0", default-features = false, features = [
  "dirs",
  "rattler_config",
  "s3",
] }
rattler_package_streaming = { version = "0.27.8", default-features = false }
rattler_shell = "0.29.0"
reqwest = { version = "0.13.5", default-features = false, features = ["http2"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5.1" }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
url = "2.5.8"

[dev-dependencies]
rstest = "0.27.0"
assert_cmd = "2.2.2"
tempfile = "3.27.0"
